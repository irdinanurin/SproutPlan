<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schedule | SproutPlan</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #fdf6e9;
            font-family: 'Outfit', sans-serif;
        }

        .app-container {
            display: grid !important;
            grid-template-columns: 200px 1fr !important;
            height: 100vh;
            width: 100vw;
        }

        .sidebar {
            background: #111 !important;
            padding: 50px 15px 20px 15px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            height: 100vh !important;
            width: 200px !important;
            box-sizing: border-box !important;
        }

        .user-profile {
            text-align: center !important;
            margin-bottom: 20px !important;
            width: 100%;
        }

            .user-profile img {
                width: 110px !important;
                height: 110px !important;
                border-radius: 25px !important;
                object-fit: cover;
                border: 3px solid #333;
                margin-bottom: 8px;
            }

        .user-name {
            font-size: 1.05rem !important;
            font-weight: 700;
            color: white !important;
            display: block;
            margin: 0;
        }

        .nav-link {
            color: #888;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 4px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }

            .nav-link.active {
                background: #222;
                color: white;
            }

        .main-area {
            padding: 15px 25px !important;
            display: flex !important;
            flex-direction: column !important;
            height: 100vh !important;
            box-sizing: border-box !important;
            gap: 6px !important;
            overflow: hidden !important;
        }

        /* Attendance */
        .att-zone {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 6px !important;
            flex-shrink: 0 !important;
        }

        .att-row {
            background: white !important;
            padding: 6px 12px !important;
            border-radius: 15px !important;
            border: 1px solid #eee !important;
            display: flex !important;
            flex-direction: column !important;
        }

            .att-row span {
                font-size: 9px !important;
                font-weight: 800 !important;
                color: #111 !important;
                line-height: 1 !important;
            }

        .week-box {
            margin-top: 3px !important;
            display: flex !important;
            gap: 2px !important;
            flex-wrap: wrap !important;
        }

        .w-dot {
            width: 13px !important;
            height: 13px !important;
            border-radius: 3px !important;
            font-size: 6.5px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-decoration: none !important;
            background: #f0f0f0 !important;
            color: #999 !important;
            font-weight: 700 !important;
        }

        /* Timetable Grid */
        .tt-grid {
            display: grid !important;
            grid-template-columns: repeat(5, 1fr) !important;
            gap: 10px !important;
            margin-top: 5px !important;
            flex-grow: 1 !important;
            overflow: hidden !important;
        }

        .day-lbl {
            font-size: 10px !important;
            font-weight: 800 !important;
            color: #8b5cf6 !important;
            text-align: center !important;
            text-transform: uppercase !important;
            margin-bottom: 6px !important;
            display: block !important;
        }

        .c-card {
            background: white !important;
            padding: 8px 10px !important;
            border-radius: 15px !important;
            border: 1px solid #eee !important;
            border-left: 4px solid #8b5cf6 !important;
            margin-bottom: 6px !important;
            position: relative !important;
        }

            .c-card b {
                font-size: 8px !important;
                color: #888 !important;
                display: block;
            }

            .c-card span {
                font-size: 10px !important;
                font-weight: 700 !important;
                color: #111 !important;
                display: block;
                margin: 1px 0 !important;
            }

            .c-card small {
                font-size: 8px !important;
                color: #999 !important;
                display: block;
            }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="user-profile">
                <img src="https://i.pravatar.cc/150?u=nurin" alt="Profile">
                <span class="user-name">Nurin Irdina</span>
            </div>
            <nav style="width: 100%;">
                <a href="dashboard.html" class="nav-link">🏠 Dashboard</a>
                <a href="schedule.html" class="nav-link active">📅 Schedule</a>
                <a href="homework.html" class="nav-link">📖 Homework</a>
            </nav>
        </aside>

        <main class="main-area">
            <header style="display:flex; justify-content:space-between; align-items:center; flex-shrink: 0;">
                <h2 style="margin:0; font-size: 20px;">My Schedule & Attendance 📅</h2>
            </header>

            <div class="att-zone">
                <!-- Repeat this block for each course -->
                <div class="att-row">
                    <span>WEB PUBLISHING</span>
                    <div class="week-box">
                        <script>for(let w=1; w<=14; w++) document.write(`<a href="#" class="w-dot">${w}</a>`);</script>
                    </div>
                </div>
            </div>

            <div class="tt-grid">
                <!-- Monday to Friday Columns -->
                <div class="day-col">
                    <span class="day-lbl">MON</span>
                    <div class="c-card">
                        <b>09:00 - 11:00</b>
                        <span>WEB PUBLISHING</span>
                        <small>📍 Lab 1</small>
                    </div>
                </div>
                <!-- Add more days here -->
            </div>
        </main>
    </div>
</body>
</html>
