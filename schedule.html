<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schedule | SproutPlan</title>
    <link rel="stylesheet" href="css/style.css">
    <script>if(localStorage.getItem('isLoggedIn') !== 'true') window.location.href = "index.html";</script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar"><nav><a href="dashboard.html" class="nav-link">🏠 Dashboard</a><a href="schedule.html" class="nav-link active">📅 Schedule</a></nav></aside>
        <main class="main-area">
            <form id="classForm"><input type="text" id="taskInput" placeholder="Course"><button type="submit">Save</button></form>
            <div id="scheduleGrid" class="tt-grid"></div>
        </main>
    </div>
    <script>
        let sched = JSON.parse(localStorage.getItem('mySchedule')) || [];
        function render() {
        document.getElementById('scheduleGrid').innerHTML = sched.map(s => `<div>${s.task}</div>`).join('');
        localStorage.setItem('mySchedule', JSON.stringify(sched));
        }
        document.getElementById('classForm').onsubmit = (e) => { e.preventDefault(); sched.push({task: document.getElementById('taskInput').value}); render(); };
        render();
    </script>
</body>
</html>
