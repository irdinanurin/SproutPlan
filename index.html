<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SproutPlan | Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fdf6e9;
            font-family: 'Outfit', sans-serif;
        }

        .login-card {
            background: white;
            padding: 50px 40px;
            border-radius: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            width: 320px;
        }

        h1 {
            color: #111;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 26px;
        }

        
        .login-hint {
            color: #888;
            font-size: 13px;
            margin-bottom: 25px;
            background: #fdf6e9;
            padding: 10px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 15px;
            border: 1px solid #eee;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.2s;
        }

            input:focus {
                border-color: #ff7eb3;
            }

        button {
            background: #ff7eb3;
            color: white;
            border: none;
            padding: 12px 45px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            margin-top: 10px;
            transition: 0.2s;
        }

            button:hover {
                background: #ff5c9d;
            }

        #error-msg {
            color: #ff4757;
            font-size: 13px;
            margin-top: 15px;
            margin-bottom: 0;
            display: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Welcome to SproutPlan</h1>

        <div class="login-hint">
            Username: <b>admin</b><br>
            Password: <b>1234</b>
        </div>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="checkLogin()">Login</button>

        <p id="error-msg">Incorrect username or password!</p>
    </div>

    <script>
        function checkLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        if (user === "admin" && pass === "1234") {
        window.location.href = "dashboard.html";
        } else {
        errorMsg.style.display = "block";
        }
        }
    </script>

</body>
</html>
