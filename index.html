<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | SproutPlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #f4f2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 60px;
            border-radius: 50px;
            width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            border: 1px solid #eee;
            margin-bottom: 15px;
            box-sizing: border-box;
            background: #fafafa;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            border: none;
            background: #111;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }

        .credential-hint {
            background: #f4f2ff;
            padding: 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 25px;
            border: 1px dashed #d1caff;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1 style="margin:0;">SproutPlan 🌱</h1>
        <p style="color:#888; margin-bottom:20px;">Welcome back, please login.</p>

        <div class="credential-hint">
            <strong>Demo Login Details:</strong><br>
            User: <code style="background: #fff; padding: 2px 6px; border-radius: 5px;">admin</code> |
            Pass: <code style="background: #fff; padding: 2px 6px; border-radius: 5px;">1234</code>
        </div>

        <form id="loginForm">
            <input type="text" id="user" placeholder="Username" required>
            <input type="password" id="pass" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;

        if (user === "admin" && pass === "1234") {
        // Login successful, save a "session" marker and redirect
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = "dashboard.html";
        } else {
        alert("Invalid username or password!");
        }
        });
    </script>
</body>
</html>
