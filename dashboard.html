<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | SproutPlan</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>if(localStorage.getItem('isLoggedIn') !== 'true') window.location.href = "index.html";</script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="user-profile"><img src="https://i.pravatar.cc/150?u=nurin" id="profileImage"></div>
            <nav><a href="dashboard.html" class="nav-link active">🏠 Dashboard</a><a href="schedule.html" class="nav-link">📅 Schedule</a><a href="homework.html" class="nav-link">📖 Homework</a><a href="logout.html" class="nav-link logout-btn">🚪 Logout</a></nav>
        </aside>
        <main class="main-area">
            <h2>Hi, Nurin Irdina 👋</h2>
            <div id="courseContainer" class="course-grid"></div>
            <div class="chart-container"><canvas id="attChart"></canvas><canvas id="pieChart"></canvas></div>
        </main>
    </div>
    <script>
        const courses = [{'code': 'CTU554', 'name': 'VALUES AND CIVILIZATION II'}, {'code': 'IMS560', 'name': 'ADVANCED DATABASE'}];
        document.getElementById('courseContainer').innerHTML = courses.map(c => `<div class="course-item"><b>${c.code}</b><span>${c.name}</span></div>`).join('');
        new Chart(document.getElementById('attChart'), { type:'bar', data:{ labels: courses.map(c => c.code), datasets:[{ data: [12, 5, 3, 2, 3, 7, 5, 2], backgroundColor:'#8b5cf6' }]}});
    </script>
</body>
</html>
