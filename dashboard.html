<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SproutPlan | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;600;700&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: #fdf6e9;
            font-family: 'Outfit', sans-serif;
        }

        .app-container {
            display: grid;
            grid-template-columns: 200px 1fr 280px;
            height: 100vh;
            width: 100vw;
        }

        
        .sidebar {
            background: #111;
            color: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            border-radius: 0 40px 40px 0;
        }

        .nav-link {
            color: #888;
            padding: 15px 10px;
            text-decoration: none;
            font-weight: 600;
            display: block;
        }

            .nav-link.active {
                color: white;
            }

        .logout {
            margin-top: auto;
            color: #ff7eb3;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            padding: 15px 10px;
        }

        
        .main {
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
        }

        .header-box {
            flex: 0 0 auto;
        }

        .chart-row {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
            padding-bottom: 20px;
        }

        
        .card {
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

            .card canvas {
                flex: 1;
                min-height: 0;
            }

       
        .right-panel {
            background: white;
            padding: 25px;
            border-left: 1px solid #eee;
            overflow-y: auto;
            height: 100vh;
            box-sizing: border-box;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
        }

        .today {
            background: #ff7eb3;
            color: white;
            border-radius: 50%;
            padding: 4px;
            font-weight: bold;
        }

       
        @media screen and (max-width: 850px) {
            html, body {
                height: auto !important;
                overflow-y: auto !important;
                overflow-x: hidden !important;
            }

            .app-container {
                display: flex !important;
                flex-direction: column !important;
                height: auto !important;
            }

            .sidebar {
                position: fixed !important;
                bottom: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 70px !important;
                flex-direction: row !important;
                justify-content: space-evenly !important;
                align-items: center !important;
                padding: 0 !important;
                border-radius: 25px 25px 0 0 !important;
                z-index: 9999 !important;
                box-shadow: 0 -5px 20px rgba(0,0,0,0.15) !important;
                box-sizing: border-box !important;
            }

                .sidebar h2 {
                    display: none !important;
                }

            .nav-link, .logout {
                font-size: 11px !important;
                padding: 5px !important;
                margin: 0 !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                gap: 4px !important;
            }

            .main {
                height: auto !important;
                padding: 20px !important;
            }

          
            .chart-row {
                display: block !important;
            }

            .card {
                flex: none !important;
                height: 280px !important;
                margin-bottom: 20px !important;
            }

            
            .right-panel {
                border-left: none !important;
                padding: 20px !important;
                padding-bottom: 90px !important;
                height: auto !important;
                border-top: 1px solid #eee !important;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2 style="color: #ff7eb3; margin-top: 0;">SproutPlan</h2>
            <a href="dashboard.html" class="nav-link active">🏠 Dashboard</a>
            <a href="schedule.html" class="nav-link">📅 Schedule</a>
            <a href="homework.html" class="nav-link">📖 Homework</a>
            <a href="index.html" class="logout">🚪 Logout</a>
        </aside>

        <main class="main">
            <div class="header-box">
                <h1 style="margin: 0; color: #333;">Hello, Nurin! 👋</h1>
            </div>
            <div class="chart-row">
                <div class="card">
                    <h3 style="margin-top: 0; color: #333;">Attendance</h3>
                    <canvas id="attChart"></canvas>
                </div>
                <div class="card">
                    <h3 style="margin-top: 0; color: #333;">Tasks Overview</h3>
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </main>

        <aside class="right-panel">
            <h3 style="margin-top: 0;">May 2026</h3>
            <div class="cal-grid">
                <div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>
                <div></div><div></div><div></div><div></div><div style="color:#ccc">1</div><div>2</div><div>3</div>
                <div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div><div>10</div>
                <div>11</div><div>12</div><div>13</div><div>14</div><div>15</div><div>16</div><div>17</div>
                <div>18</div><div>19</div><div>20</div><div>21</div><div>22</div><div>23</div><div>24</div>
                <div class="today">25</div><div>26</div><div>27</div><div>28</div><div>29</div><div>30</div><div>31</div>
            </div>

            <h3 style="margin-top: 35px; color: #333;">Upcoming 📖</h3>
            <div id="upcoming-list" style="background:#fdf6e9; padding:15px; border-radius:15px; font-size: 14px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);">
            </div>
        </aside>
    </div>

    <script>
        let rawAttData = localStorage.getItem('sproutPlanChartData');
        let savedAttData = rawAttData ? JSON.parse(rawAttData) : [10, 10, 10, 10, 10];

        let tasks = JSON.parse(localStorage.getItem('sproutPlanTasks')) || [];

        let upcomingContainer = document.getElementById('upcoming-list');
        let pendingTasks = tasks.filter(t => t.status !== 'Done');
        pendingTasks.sort((a, b) => new Date(a.due) - new Date(b.due));
        let topTasks = pendingTasks.slice(0, 5);

        if (topTasks.length === 0) {
        upcomingContainer.innerHTML = '<p style="color:#888; text-align:center; font-weight: 500;">🎉 All caught up!</p>';
        } else {
        upcomingContainer.innerHTML = topTasks.map(t => {
        let dateStr = t.due ? new Date(t.due).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
        return `<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px;">
        <span style="font-weight: 600; color: #333; font-size: 13px;">• ${t.title}</span>
        <span style="color: #ff7eb3; font-size: 11px; font-weight: 700; white-space: nowrap; margin-left: 10px; background: white; padding: 3px 8px; border-radius: 10px;">${dateStr}</span>
        </div>`;
        }).join('');
        }

        new Chart(document.getElementById('attChart'), {
        type:'bar',
        data:{ labels:['M','T','W','T','F'], datasets:[{ label: 'Score', data: savedAttData, backgroundColor:'#ff7eb3', borderRadius: 5 }] },
        options: { maintainAspectRatio: false, responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 10 } } }
        });

        let todoCount = tasks.filter(t => t.status === 'To-Do').length;
        let progressCount = tasks.filter(t => t.status === 'In Progress').length;
        let doneCount = tasks.filter(t => t.status === 'Done').length;

        new Chart(document.getElementById('pieChart'), {
        type:'pie',
        data:{ labels:['To-Do', 'In Progress', 'Done'], datasets:[{ data: [todoCount, progressCount, doneCount], backgroundColor:['#ffe5ef', '#cdd0ff', '#b4eeb4'] }] },
        options: { maintainAspectRatio: false, responsive: true, plugins: { legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8, font: { family: 'Outfit', size: 12 } } } } }
        });
    </script>
</body>
</html>
